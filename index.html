  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── ROOT: all theme-switchable via JS ── */
    :root {
      --g:   #00ffa3;  --gA: rgba(0,255,163,0.5); --gB: rgba(0,255,163,0.18);
      --gS:  rgba(0,255,163,1); --gS2: rgba(0,255,163,0.5);
      --b:   #5d8af8;  --r:  #ff4d6a;  --y: #ffb347;
      --bg0: #05080f;  --bg1: #080c16; --bg2: #0c1020; --bg3: #090d1a;
      --bd:  #181f3a;  --bd2: #243060;
      --t:   #b0c4e8;  --td:  #3d4f72; --tb: #dce8ff;
    }
    * { font-family:'JetBrains Mono',monospace; box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg0);
      background-image:
        radial-gradient(ellipse at 15% 60%, rgba(0,80,255,.05) 0%,transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(0,255,163,.025) 0%,transparent 40%);
      min-height:100vh;
    }
    /* ── SIGNATURE: CRT scanlines + vignette ── */
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);
    }
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:9998;
      background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%);
    }
    /* ── PHOSPHOR / CURSOR ── */
    .glow  { color:var(--g); text-shadow:0 0 8px var(--gA),0 0 22px var(--gB); }
    .bglow { color:var(--b); text-shadow:0 0 8px rgba(93,138,248,.4); }
    .cursor-blink {
      display:inline-block; width:8px; height:15px; flex-shrink:0;
      background:var(--g); box-shadow:0 0 8px var(--gS),0 0 20px var(--gS2);
      animation:blink 1s step-end infinite; vertical-align:text-bottom; margin-left:1px;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    /* ── TRANSITIONS ── */
    :root { transition:--g .3s,--gA .3s,--gB .3s,--gS .3s,--gS2 .3s; }
    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:var(--bg0); }
    ::-webkit-scrollbar-thumb { background:var(--bd2); border-radius:4px; }
    /* ── ANIMATIONS ── */
    .fade-in { animation:fadeIn .1s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(2px)} to{opacity:1;transform:translateY(0)} }
    .boot-in { animation:bootIn .08s ease both; }
    @keyframes bootIn { from{opacity:0} to{opacity:1} }
    .spin { animation:spin .8s linear infinite; display:inline-block; }
    @keyframes spin { to{transform:rotate(360deg)} }
    /* ── LAYOUT ── */
    #matrixCanvas { position:fixed;top:0;left:0;width:100%;height:100%;z-index:997;display:none; }
    #hiddenInput  { position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;caret-color:transparent; }
    #terminalBody {
      cursor:text; display:flex; flex-direction:column;
      height:calc(100vh - 9.2rem); overflow-y:auto;
    }
    #terminalContent { flex:1; display:flex; flex-direction:column; }
    #commandHistory  { flex:1; }
    /* ── SUGGESTION STRIP ── */
    #suggStrip {
      display:none; flex-wrap:wrap; gap:.25rem; align-items:center;
      padding:.25rem .4rem; margin:.15rem 0;
      border-top:1px dashed var(--bd); font-size:.59rem;
    }
    .sugg-chip {
      color:var(--g); cursor:pointer; padding:1px 8px;
      border:1px solid var(--bd2); border-radius:3px;
      background:var(--bg3); transition:.15s;
    }
    .sugg-chip:hover { border-color:var(--g); background:var(--bg2); }
    #currentLine {
      flex-shrink:0; margin-top:.4rem; padding-top:.28rem;
      border-top:1px solid var(--bd); min-height:1.8rem;
      display:flex; align-items:center; gap:4px; flex-wrap:nowrap;
    }
    /* ── OUTPUT ── */
    .output-pre { white-space:pre-wrap;word-break:break-word;font-size:.72rem;line-height:1.75;color:var(--t); }
    .out-block  { margin:.2rem 0 .2rem .3rem;padding:.5rem .85rem;background:var(--bg3);border-left:2px solid var(--bd2);border-radius:0 5px 5px 0; }
    .hgrid { display:grid;grid-template-columns:minmax(170px,auto) 1fr minmax(70px,auto);gap:.22rem 1rem;align-items:start; }
    @media(max-width:560px){ .hgrid{grid-template-columns:1fr;gap:.06rem;} }
    /* ── ASCII + BARS ── */
    .ascii { color:var(--g);text-shadow:0 0 6px var(--gB);font-size:.56rem;line-height:1.12;letter-spacing:.04em; }
    @media(max-width:500px){ .ascii{font-size:.38rem;} }
    .pbar-f { color:var(--g);text-shadow:0 0 4px var(--gA);letter-spacing:-1.5px; }
    .pbar-e { color:var(--bd2);letter-spacing:-1.5px; }
    /* ── CARDS + TAGS ── */
    .proj-card { border:1px solid var(--bd);border-radius:7px;padding:.55rem .75rem;margin:.3rem 0;background:var(--bg2);transition:border-color .2s;cursor:pointer; }
    .proj-card:hover { border-color:var(--bd2); }
    .tag { display:inline-block;background:rgba(93,138,248,.08);border:1px solid rgba(93,138,248,.2);color:#7aabff;padding:0 .5rem;border-radius:3px;font-size:.58rem;margin-right:3px; }
    kbd { background:rgba(255,255,255,.05);border:1px solid var(--bd2);padding:1px 5px;border-radius:3px;font-size:.58rem;color:var(--t); }
    /* ── NEOFETCH GRID ── */
    .nf-grid { display:grid;grid-template-columns:auto 1fr;gap:.22rem .75rem;font-size:.7rem; }
    .nf-key   { color:var(--g);font-weight:600;white-space:nowrap; }
    .nf-val   { color:var(--t); }
    /* ── GIT LOG ── */
    .gl-commit { font-size:.7rem;padding:.2rem 0; border-bottom:1px solid var(--bd); }
    .gl-hash   { color:var(--y); }
    .gl-ref    { color:var(--b);font-size:.62rem; }
    .gl-msg    { color:var(--tb); }
    .gl-meta   { color:var(--td);font-size:.62rem; }
    /* ── PING ── */
    .ping-line { font-size:.7rem;padding:.04rem 0; }
    /* ── MODAL ── */
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(16px);z-index:999;display:none;align-items:center;justify-content:center;padding:1rem; }
    .modal-overlay.active { display:flex; }
    .modal-content  { background:var(--bg2);border:1px solid var(--bd2);border-radius:12px;max-width:830px;width:100%;max-height:88vh;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.95); }
    .modal-header   { background:var(--bg3);padding:.75rem 1.3rem;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center; }
    .modal-header h2{ color:var(--tb);font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:.5rem; }
    .modal-header h2 i { color:var(--b); }
    .modal-close    { background:none;border:none;color:var(--td);font-size:1.1rem;cursor:pointer;transition:.2s;padding:4px;line-height:1; }
    .modal-close:hover { color:var(--r);transform:rotate(90deg); }
    .modal-tabs     { display:flex;gap:.35rem;padding:.5rem 1.3rem;background:var(--bg0);border-bottom:1px solid var(--bd);flex-wrap:wrap; }
    .modal-tab      { background:transparent;border:1px solid var(--bd);color:var(--td);padding:.26rem .9rem;border-radius:20px;font-size:.61rem;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:.2s; }
    .modal-tab:hover{ border-color:var(--bd2);color:var(--t); }
    .modal-tab.active{ background:rgba(93,138,248,.1);border-color:var(--b);color:var(--b); }
    .modal-body     { padding:1.3rem;overflow-y:auto;max-height:58vh; }
    .modal-body::-webkit-scrollbar { width:4px; }
    .modal-body::-webkit-scrollbar-thumb { background:var(--bd2);border-radius:4px; }
    .m-title { color:var(--tb);font-size:1.05rem;font-weight:600;margin-bottom:.25rem; }
    .m-tech  { color:var(--td);font-size:.72rem;margin-bottom:.7rem; }
    .m-desc  { color:var(--t);font-size:.82rem;line-height:1.75;margin-bottom:.9rem; }
    .m-sh    { color:var(--g);font-size:.74rem;font-weight:600;margin:1rem 0 .4rem;padding-bottom:.3rem;border-bottom:1px solid var(--bd); }
    .m-cmd   { display:flex;gap:.5rem 1.2rem;padding:.3rem 0;border-bottom:1px solid rgba(24,31,58,.4);flex-wrap:wrap;align-items:flex-start; }
    .m-cmd .c{ color:var(--b);font-weight:500;font-size:.69rem;min-width:160px; }
    .m-cmd .d{ color:var(--t);font-size:.69rem;flex:1; }
    .m-ver   { display:flex;gap:1rem;padding:.22rem 0;font-size:.69rem;border-bottom:1px solid rgba(24,31,58,.3); }
    .m-ver .v{ color:var(--g);font-weight:500;min-width:65px; }
    .m-ver .ch{ color:var(--t); }
    ::selection { background:rgba(93,138,248,.22);color:var(--tb); }
  </style>
</head>

function applyTheme(name) {
  const t = THEMES[name];
  if (!t) return false;
  const r = document.documentElement.style;
  r.setProperty('--g',   t.g);
  r.setProperty('--gA',  t.gA);
  r.setProperty('--gB',  t.gB);
  r.setProperty('--gS',  t.gS);
  r.setProperty('--gS2', t.gS2);
  activeTheme = name;
  $thLbl.textContent = `theme:${name}`;
  return true;
}

function updateSugg(val) {
  if (!val || val.includes(' ')) { $sugg.style.display='none'; return; }
  const matches = ALL_CMDS.filter(c=>c.startsWith(val)&&c!==val).slice(0,7);
  if (!matches.length) { $sugg.style.display='none'; return; }
  $sugg.style.display = 'flex';
  $sugg.innerHTML =
    `<span style="color:var(--td);margin-right:.2rem;">↗</span>` +
    matches.map(m=>`<span class="sugg-chip" onclick="fillCmd('${m}')">${m}</span>`).join('');
}
function fillCmd(cmd) { $inp.value=cmd+' '; cur=$inp.value; refresh(); focus(); }

// ═══════════════════════════════════════════════════════════════
//  GHOST TEXT + REFRESH
// ═══════════════════════════════════════════════════════════════
function updateGhost(val) {
  if (!val || val.includes(' ')) { $ghost.textContent=''; return; }
  const m = ALL_CMDS.find(c=>c.startsWith(val)&&c!==val);
  $ghost.textContent = m ? m.slice(val.length) : '';
}
function tabComplete() {
  const val=$inp.value;
  if (!val||val.includes(' ')) return;
  const m=ALL_CMDS.find(c=>c.startsWith(val)&&c!==val);
  if (m) { $inp.value=m+' '; cur=$inp.value; refresh(); $ghost.textContent=''; }
}
function refresh() {
  $disp.textContent = cur;
  updateGhost(cur.trim());
  updateSugg(cur.trim());
  scroll();
}

// ═══════════════════════════════════════════════════════════════
//  COMMAND DISPATCH
// ═══════════════════════════════════════════════════════════════
function handle(raw) {
  if (isProcessing) return;
  isProcessing = true;
  const trimmed = raw.trim();
  if (!trimmed) { isProcessing=false; return; }

  cmdHist.push(trimmed);
  histIdx = cmdHist.length;
  printPrompt(trimmed);

  const parts = trimmed.split(/\s+/);
  const cmd   = parts[0].toLowerCase();
  const args  = parts.slice(1);

  switch(cmd) {
    case 'help': case 'h': case '?': cmdHelp(); break;
    case 'about':                    cmdAbout(); break;
    case 'projects':                 cmdProjects(); break;
    case 'project': case 'p':
      if (!args[0]) printText('Usage: project <name>\nType "projects" to list all.','var(--y)');
      else if (PROJECTS[args[0]]) openModal(args[0]);
      else printText(`Project "${args[0]}" not found.\nAvailable: `+Object.keys(PROJECTS).join(', '),'var(--r)');
      break;
    case 'skills':                   cmdSkills(); break;
    case 'experience': case 'exp':   cmdExperience(); break;
    case 'contact':                  cmdContact(); break;
    case 'social':                   cmdSocial(); break;
    case 'version': case 'v':
      if (!args[0]) printText('Usage: version <project>\nAvailable: reverse-shell, netcat, phantomgate','var(--y)');
      else if (VERSIONS[args[0]]) {
        openModal('phantomgate');
        setTimeout(()=>{const t=document.querySelector(`.modal-tab[data-tab="${args[0]}"]`);if(t)t.click();},100);
      } else printText(`No version history for "${args[0]}".`,'var(--r)');
      break;
    case 'neofetch':                 cmdNeofetch(); break;
    case 'ping':                     cmdPing(args[0]); break;
    case 'git':
      if (args[0]==='log') cmdGitLog();
      else printText(`git: '${args[0]||'<subcommand>'}' — try: git log`,'var(--r)');
      break;
    case 'fortune':                  cmdFortune(); break;
    case 'sudo':                     cmdSudo(args.join(' ')); break;
    case 'hack':                     cmdHack(); break;
    case 'history':                  cmdHistory(); break;
    case 'open':                     cmdOpen(args[0]); break;
    case 'stat':                     cmdStat(args[0]); break;
    case 'theme':
      if (!args[0]) {
        printText(`Available themes: ${Object.keys(THEMES).join(', ')}\nUsage: theme <name>`,'var(--y)');
      } else { cmdTheme(args[0]); }
      break;
    case 'clear': case 'cls':
      $hist.innerHTML=''; $boot.innerHTML=''; break;
    case 'echo':
      printText(args.join(' ')||''); break;
    case 'whoami':
      printText('omerkemal · Full-Stack Developer & Security Engineer · Adama, Ethiopia','var(--b)'); break;
    case 'uname':
      printText('portfolio-os 2.1.0 #1 SMP Mon Jul 27 00:00:00 UTC 2026 x86_64 GNU/Linux','var(--td)'); break;
    case 'date':
      printText(new Date().toLocaleString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}),'var(--td)'); break;
    case 'ls':
      if (!args[0]||args[0]==='projects') {
        appendRaw(`<div class="out-block">${Object.keys(PROJECTS).map(k=>`<span class="bglow" style="margin-right:1.2rem;">${esc(k)}</span>`).join('')}</div>`);
        printText('→ project <name> to open details','var(--td)');
      } else if (args[0]==='skills') { cmdSkills(); }
      else printText(`ls: ${args[0]}: No such file or directory`,'var(--r)');
      break;
    case 'man':
      if (!args[0]) printText('Usage: man <command>','var(--y)');
      else cmdMan(args[0]);
      break;
    case 'matrix':  cmdMatrix(); break;
    case 'exit': case 'quit':
      printText('Exiting… Goodbye! 👋','var(--y)');
      setTimeout(()=>{ $hist.innerHTML=''; $boot.innerHTML=''; cur=''; refresh(); focus(); isProcessing=false; showWelcome(); },550);
      return;
    default:
      printText(`bash: ${cmd}: command not found\nType "help" for available commands.`,'var(--r)');
  }
  isProcessing=false; scroll(); focus();
}

function cmdMatrix() {

function startMatrix() {
  matRunning=true; $canvas.style.display='block';
  const ctx=$canvas.getContext('2d');
  $canvas.width=window.innerWidth; $canvas.height=window.innerHeight;
  const cols=Math.floor($canvas.width/14), drops=Array(cols).fill(1);
  const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ0123456789ABCDEF';
  function draw(){
    if(!matRunning) return;
    ctx.fillStyle='rgba(5,8,15,0.05)';
    ctx.fillRect(0,0,$canvas.width,$canvas.height);
    ctx.fillStyle='var(--g)'; ctx.font='13px JetBrains Mono';
    // use actual CSS var value
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--g').trim()||'#00ffa3';
    drops.forEach((y,i)=>{
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*14,y*14);
      if(y*14>$canvas.height&&Math.random()>.975) drops[i]=0;
      drops[i]++;
    });
    matTimer=requestAnimationFrame(draw);
  }
  draw();
}
function stopMatrix(){
  matRunning=false;
  if(matTimer) cancelAnimationFrame(matTimer);
  $canvas.style.display='none';
  $canvas.getContext('2d').clearRect(0,0,$canvas.width,$canvas.height);
  printText('Exited Matrix. Welcome back, Neo.','var(--g)');
}

  if(!$modal.classList.contains('active')) return;
  const tabs=[...$mTabs.querySelectorAll('.modal-tab')];
  const active=tabs.findIndex(t=>t.classList.contains('active'));
  if(e.key==='ArrowRight'&&active<tabs.length-1) tabs[active+1].click();

});

//  INPUT HANDLING
// ═══════════════════════════════════════════════════════════════
$inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const v=$inp.value;
    if(v){cmdHist.push(v); histIdx=cmdHist.length;}
    handle(v);
    $inp.value=''; cur=''; refresh(); $ghost.textContent='';
    focus(); return;
  }
  if(e.key==='Tab'){e.preventDefault(); tabComplete(); return;}
  if(e.key==='l'&&e.ctrlKey){e.preventDefault(); $hist.innerHTML=''; $boot.innerHTML=''; $sugg.style.display='none'; return;}
  if(e.key==='c'&&e.ctrlKey){
    e.preventDefault();
    printPrompt($inp.value?$inp.value+'  ^C':'^C');
    $inp.value=''; cur=''; refresh(); $ghost.textContent=''; return;
  }
  if(e.key==='Escape'){
    if(matRunning) stopMatrix();
    if($modal.classList.contains('active')) $modal.classList.remove('active');
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(histIdx>0){histIdx--; $inp.value=cmdHist[histIdx]||''; cur=$inp.value; refresh();}
    return;
  }
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx<cmdHist.length-1){histIdx++; $inp.value=cmdHist[histIdx];}
    else{histIdx=cmdHist.length; $inp.value='';}
    cur=$inp.value; refresh(); return;
  }
  setTimeout(()=>{ cur=$inp.value; refresh(); },0);
});
$inp.addEventListener('input',()=>{ cur=$inp.value; refresh(); });

// Focus management
$body.addEventListener('click',()=>focus());
document.querySelector('.max-w-4xl')?.addEventListener('click',e=>{ if(e.target.tagName!=='INPUT') focus(); });
window.addEventListener('resize',()=>{
  if(matRunning){$canvas.width=window.innerWidth; $canvas.height=window.innerHeight;}
});

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
runBoot(()=>{ focus(); refresh(); });
window.addEventListener('load',()=>setTimeout(focus,100));
</script>
