{% extends "base.html" %}

{% block title %}Register - LinkManager{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md slide-in">
        <div class="glass-effect-dark rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-block p-3 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl mb-4">
                    <i class="fas fa-user-plus text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800">Create Account</h2>
                <p class="text-gray-500 mt-2">Start managing your links today</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl mb-6 alert-auto-hide">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
                    <p class="text-red-700 text-sm">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login_view.register') }}" class="space-y-5">
                <div>
                    <label class="form-label" for="username">
                        <i class="fas fa-user text-gray-400 mr-2"></i>Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required
                           placeholder="Choose a username"
                           class="form-input">
                </div>
                <div>
                    <label class="form-label" for="display_name">
                        <i class="fas fa-user text-gray-400 mr-2"></i>Display Name
                    </label>
                    <input type="text" 
                           id="display_name" 
                           name="display_name" 
                           required
                           placeholder="Choose a display name"
                           class="form-input">
                </div>
                <div>
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope text-gray-400 mr-2"></i>Email Address
                    </label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           required
                           placeholder="Enter your email"
                           class="form-input">
                </div>

                <div>
                    <label class="form-label" for="password">
                        <i class="fas fa-lock text-gray-400 mr-2"></i>Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           placeholder="Create a password"
                           class="form-input">
                    <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters</p>
                </div>

                <div>
                    <label class="form-label" for="confirm_password">
                        <i class="fas fa-check-circle text-gray-400 mr-2"></i>Confirm Password
                    </label>
                    <input type="password" 
                           id="confirm_password" 
                           name="confirm_password" 
                           required
                           placeholder="Confirm your password"
                           class="form-input">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" 
                           id="terms" 
                           name="terms" 
                           required
                           class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="terms" class="ml-2 text-sm text-gray-600">
                        I agree to the 
                        <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">Terms of Service</a>
                        and 
                        <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-primary w-full flex items-center justify-center space-x-2">
                    <i class="fas fa-user-plus"></i>
                    <span>Create Account</span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Already have an account? 
                    <a href="{{ url_for('login_view.login') }}" class="text-blue-600 hover:text-blue-700 font-semibold">
                        Sign in
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
