{% extends "base.html" %}

{% block title %}Register - FrogLink 🐸{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md slide-in">
        <div class="glass-effect-dark rounded-3xl p-8 shadow-2xl border-2 border-green-200">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-gradient-to-br from-green-400 to-green-600 rounded-3xl mb-4 shadow-lg">
                    <span class="text-5xl frog-bounce">🐸</span>
                </div>
                <h2 class="text-3xl font-bold text-green-800">Join the Pond!</h2>
                <p class="text-green-600 mt-2">Create your frogtastic account 🍃</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl mb-6 alert-auto-hide">
                <div class="flex items-center">
                    <span class="text-red-500 mr-3">❌</span>
                    <p class="text-red-700 text-sm">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login_view.register') }}" class="space-y-5">
                <div>
                    <label class="form-label" for="username">
                        <span class="mr-2">👤</span>Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required
                           placeholder="Choose a username"
                           class="form-input">
                </div>

                <div>
                    <label class="form-label" for="display_name">
                        <span class="mr-2">🏷️</span>Display Name
                    </label>
                    <input type="text" 
                           id="display_name" 
                           name="display_name" 
                           required
                           placeholder="Your display name"
                           class="form-input">
                </div>

                <div>
                    <label class="form-label" for="email">
                        <span class="mr-2">📧</span>Email Address
                    </label>
                    <input type="email" 
                           id="email" 
                           name="email" 
                           required
                           placeholder="Enter your email"
                           class="form-input">
                </div>

                <div>
                    <label class="form-label" for="password">
                        <span class="mr-2">🔒</span>Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           placeholder="Create a password"
                           class="form-input">
                    <p class="text-xs text-green-600 mt-1">Must be at least 8 characters 🐸</p>
                </div>

                <div>
                    <label class="form-label" for="confirm_password">
                        <span class="mr-2">✅</span>Confirm Password
                    </label>
                    <input type="password" 
                           id="confirm_password" 
                           name="confirm_password" 
                           required
                           placeholder="Confirm your password"
                           class="form-input">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" 
                           id="terms" 
                           name="terms" 
                           required
                           class="w-4 h-4 rounded border-green-300 text-green-600 focus:ring-green-500">
                    <label for="terms" class="ml-2 text-sm text-green-700">
                        I agree to the 
                        <a href="#" class="text-green-600 hover:text-green-700 font-medium">Terms of Service</a>
                        and 
                        <a href="#" class="text-green-600 hover:text-green-700 font-medium">Privacy Policy</a>
                        🐸
                    </label>
                </div>

                <button type="submit" class="btn-primary w-full flex items-center justify-center space-x-2">
                    <span>🐸</span>
                    <span>Create Account</span>
                    <span>✨</span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-green-700">
                    Already have an account? 
                    <a href="{{ url_for('login_view.login') }}" class="text-green-600 hover:text-green-700 font-semibold">
                        Hop back in! 🐸
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
