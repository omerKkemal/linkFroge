{% extends "base.html" %}

{% block title %}Login - LinkManager{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md slide-in">
        <div class="glass-effect-dark rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-block p-3 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl mb-4">
                    <i class="fas fa-sign-in-alt text-white text-2xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-gray-500 mt-2">Sign in to your account</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl mb-6 alert-auto-hide">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
                    <p class="text-red-700 text-sm">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login_view.login') }}" class="space-y-6">
                <div>
                    <label class="form-label" for="username">
                        <i class="fas fa-user text-gray-400 mr-2"></i>Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required
                           placeholder="Enter your username"
                           class="form-input">
                </div>

                <div>
                    <label class="form-label" for="password">
                        <i class="fas fa-lock text-gray-400 mr-2"></i>Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           placeholder="Enter your password"
                           class="form-input">
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center text-sm text-gray-600">
                        <input type="checkbox" name="remember" class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <span class="ml-2">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-blue-600 hover:text-blue-700 font-medium">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="btn-primary w-full flex items-center justify-center space-x-2">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Don't have an account? 
                    <a href="{{ url_for('login_view.register') }}" class="text-blue-600 hover:text-blue-700 font-semibold">
                        Create one now
                    </a>
                </p>
            </div>

            <div class="mt-8 flex items-center">
                <div class="flex-1 border-t border-gray-300"></div>
                <span class="px-4 text-sm text-gray-500">Or continue with</span>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-3">
                <button class="px-4 py-2 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors duration-300 flex items-center justify-center space-x-2">
                    <i class="fab fa-google text-red-500"></i>
                    <span class="text-sm font-medium text-gray-700">Google</span>
                </button>
                <button class="px-4 py-2 border border-gray-300 rounded-xl hover:bg-gray-50 transition-colors duration-300 flex items-center justify-center space-x-2">
                    <i class="fab fa-github text-gray-800"></i>
                    <span class="text-sm font-medium text-gray-700">GitHub</span>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
