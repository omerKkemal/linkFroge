{% extends "base.html" %}

{% block title %}Login - FrogLink 🐸{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md slide-in">
        <div class="glass-effect-dark rounded-3xl p-8 shadow-2xl border-2 border-green-200">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-gradient-to-br from-green-400 to-green-600 rounded-3xl mb-4 shadow-lg">
                    <span class="text-5xl frog-bounce">🐸</span>
                </div>
                <h2 class="text-3xl font-bold text-green-800">Welcome Back!</h2>
                <p class="text-green-600 mt-2">Hop back into your account 🍃</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl mb-6 alert-auto-hide">
                <div class="flex items-center">
                    <span class="text-red-500 mr-3">❌</span>
                    <p class="text-red-700 text-sm">{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login_view.login') }}" class="space-y-6">
                <div>
                    <label class="form-label" for="username">
                        <span class="mr-2">👤</span>Username
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           required
                           placeholder="Enter your username"
                           class="form-input">
                </div>

                <div>
                    <label class="form-label" for="password">
                        <span class="mr-2">🔒</span>Password
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           required
                           placeholder="Enter your password"
                           class="form-input">
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center text-sm text-green-700">
                        <input type="checkbox" name="remember" class="w-4 h-4 rounded border-green-300 text-green-600 focus:ring-green-500">
                        <span class="ml-2">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-green-600 hover:text-green-700 font-medium">
                        Forgot password? 🐸
                    </a>
                </div>

                <button type="submit" class="btn-primary w-full flex items-center justify-center space-x-2">
                    <span>🐸</span>
                    <span>Hop In!</span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-green-700">
                    Don't have an account? 
                    <a href="{{ url_for('login_view.register') }}" class="text-green-600 hover:text-green-700 font-semibold">
                        Create one now 🐸
                    </a>
                </p>
            </div>

            <div class="mt-8 flex items-center">
                <div class="flex-1 border-t border-green-200"></div>
                <span class="px-4 text-sm text-green-500">Or continue with</span>
                <div class="flex-1 border-t border-green-200"></div>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-3">
                <button class="px-4 py-2 border-2 border-green-200 rounded-xl hover:bg-green-50 transition-colors duration-300 flex items-center justify-center space-x-2">
                    <span>🌐</span>
                    <span class="text-sm font-medium text-green-700">Google</span>
                </button>
                <button class="px-4 py-2 border-2 border-green-200 rounded-xl hover:bg-green-50 transition-colors duration-300 flex items-center justify-center space-x-2">
                    <span>🐙</span>
                    <span class="text-sm font-medium text-green-700">GitHub</span>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
